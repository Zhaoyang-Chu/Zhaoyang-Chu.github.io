name: Get Citation Data

on:
  page_build:
  workflow_dispatch:           # allow manual re-run from the Actions tab
  schedule:
    - cron: '0 8 * * 1'        # weekly, Monday 08:00 UTC

permissions:
  contents: write              # explicit write so the push to google-scholar-stats can't 403

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10          # successful scrapes take ~30s; kill hung runs fast instead of the 6h default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run
        run: |
          cd ./google_scholar_crawler
          pip install -r requirements.txt
          python main.py
          cd ./results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.json
          git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
